<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Value Screener</title>
<meta name="description" content="Daily Buffett-style quality screen with valuation and briefs.">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Screener">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  color-scheme: light;
  --page: #f4f3f0;
  --surface: #fcfcfb;
  --surface-2: #f0efec;
  --border: #e3e2dd;
  --text: #0b0b0b;
  --text-2: #52514e;
  --text-3: #7a7974;
  --accent: #256abf;
  --series: #2a78d6;
  --neg: #e34948;
  --good: #0ca30c;
  --good-ink: #006300;
  --good-wash: rgba(12,163,12,.10);
  --warn: #fab219;
  --warn-wash: rgba(250,178,25,.14);
  --crit: #d03b3b;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #121211;
    --surface: #1a1a19;
    --surface-2: #232321;
    --border: #2e2e2b;
    --text: #f0efec;
    --text-2: #c3c2b7;
    --text-3: #93928a;
    --accent: #6da7ec;
    --series: #3987e5;
    --neg: #e66767;
    --good-ink: #5fd35f;
    --good-wash: rgba(12,163,12,.18);
    --warn-wash: rgba(250,178,25,.16);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #121211; --surface: #1a1a19; --surface-2: #232321; --border: #2e2e2b;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #93928a; --accent: #6da7ec;
  --series: #3987e5; --neg: #e66767; --good-ink: #5fd35f;
  --good-wash: rgba(12,163,12,.18); --warn-wash: rgba(250,178,25,.16);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--text);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
main { max-width: 640px; margin: 0 auto; padding: 16px 16px 48px; }
a { color: var(--accent); }
button, input { font: inherit; color: inherit; }
h1 { font-size: 26px; line-height: 1.15; margin: 8px 0 2px; letter-spacing: -0.01em; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2);
     margin: 28px 0 10px; font-weight: 600; }
.muted { color: var(--text-3); font-size: 14px; }
.foldhead { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px;
            background: none; border: 0; padding: 6px 0; margin: 22px 0 4px; cursor: pointer; text-align: left;
            -webkit-tap-highlight-color: transparent; }
.foldhead h2 { margin: 0; }
.foldhead .fc { color: var(--text-3); font-size: 13px; display: flex; align-items: center; gap: 6px; }
.foldhead .fc::after { content: "›"; font-size: 20px; line-height: 1; transform: rotate(90deg); transition: transform .15s; }
.foldhead[aria-expanded="false"] .fc::after { transform: rotate(0deg); }
.foldbody > :first-child { margin-top: 6px; }
.foldtools { display: flex; justify-content: flex-end; gap: 14px; margin-top: 14px; font-size: 13px; }
.foldtools button { background: none; border: 0; padding: 4px 0; color: var(--accent); cursor: pointer; }
.sub { color: var(--text-2); font-size: 14px; margin: 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 14px 16px; }
.stack > * + * { margin-top: 10px; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.iconbtn { background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
           padding: 7px 14px; font-size: 14px; cursor: pointer; white-space: nowrap; }
.summary { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.stat { flex: 1 1 0; min-width: 0; background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 10px 12px; }
.stat b { display: block; font-size: 24px; line-height: 1.1; }
.stat span { font-size: 13px; color: var(--text-2); }

/* Signal cards */
.sig { display: block; text-decoration: none; color: inherit; }
.sig .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.tk { font-weight: 700; font-size: 18px; }
.sig .nm { display: block; margin-top: 1px; }
.nm { color: var(--text-2); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.disc { font-weight: 700; color: var(--good-ink); white-space: nowrap; }
.nums { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-2); margin-top: 6px; gap: 8px; }
.nums b { color: var(--text); font-weight: 600; }
.range { position: relative; height: 10px; margin-top: 10px; border-radius: 5px; background: var(--surface-2); }
.range .zone { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px 0 0 5px; background: var(--good-wash);
               border-right: 2px solid var(--good); }
.range .val { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text-2); border-radius: 1px; }
.range .px { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
             background: var(--series); box-shadow: 0 0 0 2px var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 12.5px; line-height: 1.3; padding: 5px 10px; border-radius: 10px; background: var(--warn-wash);
        color: var(--text); display: inline-flex; gap: 5px; align-items: baseline; }
.chip i { font-style: normal; font-weight: 700; color: var(--text-2); }
.amount { margin-top: 10px; font-size: 14px; color: var(--text-2); }
.amount b { color: var(--text); }

/* Lists */
.list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.li { display: flex; align-items: center; gap: 12px; padding: 11px 16px; text-decoration: none; color: inherit;
      border-top: 1px solid var(--border); min-height: 52px; }
.li:first-child { border-top: 0; }
.li .l { flex: 1; min-width: 0; }
.li .l div:first-child { font-weight: 650; }
.li .r { text-align: right; font-size: 14px; white-space: nowrap; }
.li .r div:last-child { color: var(--text-3); font-size: 12.5px; }
.chev { color: var(--text-3); }
.near { height: 4px; border-radius: 2px; background: var(--surface-2); margin-top: 5px; overflow: hidden; }
.near span { display: block; height: 100%; background: var(--series); border-radius: 2px; }
input[type=search] { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border);
                     background: var(--surface); margin-bottom: 10px; }
.empty { color: var(--text-2); font-size: 15px; }

/* Settings */
details.settings { margin-top: 12px; }
details.settings:not([open]) { display: none; }
details.settings summary { list-style: none; }
details.settings summary::-webkit-details-marker { display: none; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; margin-top: 10px; }
.form label { font-size: 13px; color: var(--text-2); display: block; }
.form input { width: 100%; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--border);
              background: var(--surface-2); margin-top: 3px; }
.form .wide { grid-column: 1 / -1; }

/* Brief */
.back { display: inline-block; margin: 4px 0 6px; text-decoration: none; font-size: 15px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 4px 10px;
        border-radius: 999px; margin-top: 10px; background: var(--surface-2); color: var(--text-2); }
.pill.good { background: var(--good-wash); color: var(--good-ink); }
.pill.good::before { content: "\2713"; }
.hero { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.hero div span { display: block; font-size: 12.5px; color: var(--text-2); }
.hero div b { font-size: 20px; }
.note { font-size: 14px; padding: 10px 12px; border-radius: 10px; background: var(--warn-wash); }
.note + .note { margin-top: 8px; }
.note b::before { content: "! "; color: var(--text-2); }
.checks { list-style: none; padding: 0; margin: 0; }
.checks li { padding: 7px 0 7px 26px; position: relative; font-size: 15px; border-top: 1px solid var(--border); }
.checks li:first-child { border-top: 0; }
.checks li::before { content: "\2713"; position: absolute; left: 2px; color: var(--good); font-weight: 700; }
.checks li span { display: block; color: var(--text-2); font-size: 13.5px; }
.checks li.fail::before { content: "\2715"; color: var(--crit); }
.checks li.na::before { content: "?"; color: var(--text-3); }
.searchbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--page);
             padding-block: 10px 6px; margin-top: 6px; }
.searchbar input { margin: 0; font-size: 16px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
               z-index: 10; background: var(--page); }
.pill.bad { background: var(--warn-wash); color: var(--text); }
.st-fail { color: var(--text-2); }
.st-review { display: inline-block; font-weight: 650; padding: 1px 8px; border-radius: 999px; background: var(--warn-wash); }
.st-ok { color: var(--good-ink); font-weight: 650; }
.pill.own { background: var(--surface-2); color: var(--text); margin-left: 6px; }
p { margin: 0; }
.charts { display: grid; grid-template-columns: 1fr; gap: 10px; }
.chart .ct { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.chart .ct span:first-child { font-weight: 600; }
.chart .ct span:last-child { color: var(--text-2); }
.chart svg { display: block; width: 100%; height: auto; margin-top: 6px; touch-action: pan-y; }
.chart .bar { transition: opacity .12s; }
.chart.active .bar { opacity: .4; }
.chart.active .bar.on { opacity: 1; }
.yr { font-size: 10px; fill: var(--text-3); }
.base { stroke: var(--border); stroke-width: 1; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: right; padding: 6px 4px; border-top: 1px solid var(--border); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-2); font-weight: 600; }
.tablewrap { overflow-x: auto; }
details.tbl summary { cursor: pointer; color: var(--accent); font-size: 15px; }
.links a { display: flex; justify-content: space-between; padding: 11px 0; border-top: 1px solid var(--border);
           text-decoration: none; }
.links a:first-child { border-top: 0; }
.links a span { color: var(--text-3); font-size: 13px; }
footer { margin-top: 32px; font-size: 12.5px; color: var(--text-3); }
</style>
</head>
<body>
<main id="app"></main>
<script id="data" type="application/json">/*__DATA__*/</script>
<script>
(function () {
  "use strict";
  var RAW = JSON.parse(document.getElementById("data").textContent);
  var DATA = null, BY = {};
  var app = document.getElementById("app");
  var KEYSTORE = "valueScreener.key.v1";

  function boot(d) {
    DATA = d;
    DATA.companies.forEach(function (c) { BY[c.ticker] = c; });
    route();
  }

  // ---------- unlock (only when the published page is encrypted) ----------
  function b64d(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function b64e(buf) { var u = new Uint8Array(buf), s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function keyFromPass(pass) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64d(RAW.salt), iterations: RAW.iter, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
      });
  }
  function openWith(key) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(RAW.iv) }, key, b64d(RAW.ct))
      .then(function (pt) { return JSON.parse(new TextDecoder().decode(pt)); });
  }
  function storedKey() {
    try {
      var s = JSON.parse(localStorage.getItem(KEYSTORE));
      if (!s || s.salt !== RAW.salt) return Promise.reject();
      return crypto.subtle.importKey("raw", b64d(s.k), "AES-GCM", true, ["decrypt"]);
    } catch (e) { return Promise.reject(); }
  }
  function forgetKey() { try { localStorage.removeItem(KEYSTORE); } catch (e) {} }

  function lockScreen(msg) {
    app.innerHTML = '<div style="max-width:380px;margin:12vh auto 0">' +
      '<h1>Value Screener</h1><p class="sub" style="margin-bottom:16px">Enter your passphrase to open today’s results.</p>' +
      '<form id="unlock" class="card stack" autocomplete="on">' +
      '<input type="text" name="username" value="value-screener" autocomplete="username" hidden>' +
      '<label for="pass" class="muted">Passphrase</label>' +
      '<input id="pass" type="password" autocomplete="current-password" required ' +
      'style="width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2)">' +
      '<label class="muted" style="display:flex;gap:8px;align-items:center"><input id="remember" type="checkbox" checked> Remember on this device</label>' +
      '<button type="submit" class="iconbtn" style="width:100%;padding:11px;background:var(--accent);color:#fff;border:0">Unlock</button>' +
      '<p id="umsg" class="muted" role="status">' + esc(msg || "") + '</p></form></div>';
    var form = document.getElementById("unlock"), um = document.getElementById("umsg");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      um.textContent = "Unlocking…";
      var remember = document.getElementById("remember").checked, key;
      keyFromPass(document.getElementById("pass").value)
        .then(function (k) { key = k; return openWith(k); })
        .then(function (d) {
          if (remember) {
            crypto.subtle.exportKey("raw", key).then(function (raw) {
              try { localStorage.setItem(KEYSTORE, JSON.stringify({ salt: RAW.salt, k: b64e(raw) })); } catch (e) {}
            });
          }
          boot(d);
        })
        .catch(function () { um.textContent = "That passphrase didn’t work. Try again."; });
    });
  }

  function start() {
    if (!RAW.locked) return boot(RAW);
    if (!window.crypto || !crypto.subtle) {
      app.innerHTML = '<p class="card" style="margin-top:20vh">This page needs a secure (https) connection to unlock.</p>';
      return;
    }
    storedKey().then(openWith).then(boot).catch(function () { forgetKey(); lockScreen(); });
  }
  var KEY = "valueScreener.sizing.v1";
  var homeScroll = 0, lastQuery = "";

  // ---------- helpers ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }
  function px(x) {
    if (x == null) return "—";
    return "$" + x.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function big(x) {
    if (x == null) return "—";
    var a = Math.abs(x), s = x < 0 ? "−$" : "$";
    if (a >= 1e12) return s + (a / 1e12).toFixed(2) + "T";
    if (a >= 1e9) return s + (a / 1e9).toFixed(a >= 1e11 ? 0 : 1) + "B";
    if (a >= 1e6) return s + (a / 1e6).toFixed(0) + "M";
    return s + a.toLocaleString("en-US");
  }
  function pct(x, d) { return x == null ? "—" : (x * 100).toFixed(d == null ? 0 : d) + "%"; }
  function whole(x) { return "$" + Math.round(x).toLocaleString("en-US"); }

  function loadSizing() {
    try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; }
  }
  function saveSizing(s) {
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
  }

  // Mirrors sizing.py: biggest discount first, capped per position, limited slots.
  function sizeSignals(signals, s) {
    var out = {};
    if (!s || !(s.cash > 0)) return out;
    var cash = s.cash, cap = s.cash * s.maxPct / 100;
    var held = {};
    (s.holdings || []).forEach(function (t) { held[t] = true; });
    var slots = s.maxHoldings > 0 ? s.maxHoldings - Object.keys(held).length : Infinity;
    if (!(cap > 0)) cap = cash;
    signals.slice().sort(function (a, b) { return b.discount - a.discount; }).forEach(function (c) {
      if (held[c.ticker]) out[c.ticker] = { note: "already held" };
      else if (slots <= 0) out[c.ticker] = { note: "max holdings reached" };
      else if (cash <= 0) out[c.ticker] = { note: "cash reserve used up" };
      else { var amt = Math.min(cap, cash); out[c.ticker] = { amount: amt }; cash -= amt; slots -= 1; }
    });
    return out;
  }

  function rangeBar(c) {
    if (!c.value || !c.price) return "";
    var max = Math.max(c.value, c.price) * 1.08;
    var z = Math.min(100, c.buy_below / max * 100);
    return '<div class="range" aria-hidden="true">' +
      '<div class="zone" style="width:' + z.toFixed(1) + '%"></div>' +
      '<div class="val" style="left:' + (c.value / max * 100).toFixed(1) + '%"></div>' +
      '<div class="px" style="left:' + (c.price / max * 100).toFixed(1) + '%"></div></div>';
  }

  function cautions(c) {
    var list = (c.warnings || []).slice();
    if (c.verify) list.push("debt figure assumed or estimated: confirm in the 10-K");
    if (c.suspicious) list.push("discount unusually large: check the data before trusting it");
    if (c.sector === "Health Care") list.push("healthcare: check your employer's conflict-of-interest rules");
    return list;
  }

  // ---------- home ----------
  function home() {
    var signals = DATA.companies.filter(function (c) { return c.signal; });
    var watch = DATA.companies.filter(function (c) { return !c.signal && c.to_buy_price != null; })
                              .slice(0, DATA.settings.watchlist_size);
    var s = loadSizing();
    var sized = sizeSignals(signals, s);

    var h = '<div class="top"><div><h1>Value Screener</h1>' +
      '<p class="sub">Updated ' + esc(DATA.generated) + '</p></div>' +
      '<button class="iconbtn" id="sizingBtn" aria-expanded="false">My budget</button></div>';

    h += '<details class="settings card" id="settings"><summary></summary>' +
      '<p><b>My budget</b></p><p class="muted">How much you have to invest and your limits. The app uses this to suggest how much to put into each pre-buy watch stock, if you decide to buy. Saved only on this device, never sent anywhere.</p>' +
      '<div class="form">' +
      '<div><label for="sCash">Money available to invest ($)</label><input id="sCash" inputmode="decimal" placeholder="e.g. 10000"></div>' +
      '<div><label for="sPct">Most in any one stock (% of that money)</label><input id="sPct" inputmode="decimal" placeholder="e.g. 20"></div>' +
      '<div><label for="sMax">Most stocks to own at once</label><input id="sMax" inputmode="numeric" placeholder="blank = no limit"></div>' +
      '<div class="wide"><label for="sHeld">Stocks you already own (tickers)</label><input id="sHeld" placeholder="e.g. KO, COST" autocapitalize="characters"></div>' +
      '</div></details>';

    h += '<div class="searchbar"><input type="search" id="q" placeholder="Search any S&amp;P 500 company" ' +
      'aria-label="Search any S&amp;P 500 company by ticker or name" autocomplete="off" autocorrect="off" spellcheck="false"></div>' +
      '<div id="results" hidden></div><div id="homeBody">';

    var held = (s && s.holdings) || [];
    if (held.length) {
      var flagged = held.filter(function (t) { return holdingReasons(t).length; }).length;
      h += '<h2>Your holdings</h2><p class="muted" style="margin:-4px 0 10px">' +
        (flagged ? flagged + ' of ' + held.length + ' need' + (flagged === 1 ? 's' : '') + ' a review. ' : 'No flags today. ') +
        'A flag means “take a look”, not “sell”.</p><div class="list">' + held.map(holdingRow).join('') + '</div>';
    }

    h += '<div class="summary keep">' +
      '<div class="stat"><b>' + signals.length + '</b><span>on pre-buy watch</span></div>' +
      '<div class="stat"><b>' + passing().length + '</b><span>quality businesses</span></div>' +
      '<div class="stat"><b>' + pct(DATA.settings.margin) + '</b><span>margin of safety</span></div></div>';

    h += '<h2>Pre-buy watch</h2><p class="muted" style="margin:-4px 0 10px">Price is at least ' + pct(DATA.settings.margin) +
      ' below the estimated value. Not a buy order: research these first.</p>';
    if (!signals.length) {
      h += '<div class="card empty">Nothing on the pre-buy watch today. That’s normal: the screen is strict. ' +
           '“Getting close” shows what’s nearest.</div>';
    } else {
      h += '<div class="stack">';
      signals.forEach(function (c) {
        var cs = cautions(c), z = sized[c.ticker];
        h += '<a class="card sig" href="#/' + encodeURIComponent(c.ticker) + '">' +
          '<div class="row1"><div style="min-width:0"><span class="tk">' + esc(c.ticker) + '</span> ' +
          '<span class="nm">' + esc(c.name) + '</span></div><span class="disc">' + pct(c.discount) + ' below value</span></div>' +
          rangeBar(c) +
          '<div class="nums"><span>Price <b>' + px(c.price) + '</b></span><span>Buy below <b>' + px(c.buy_below) +
          '</b></span><span>Value <b>' + px(c.value) + '</b></span></div>';
        if (cs.length) {
          h += '<div class="chips">' + cs.map(function (w) { return '<span class="chip"><i>!</i>' + esc(w) + '</span>'; }).join("") + '</div>';
        }
        if (z && z.amount) h += '<div class="amount">Suggested: <b>' + whole(z.amount) + '</b></div>';
        else if (z && z.note) h += '<div class="amount">Suggested: none (' + esc(z.note) + ')</div>';
        else h += '<div class="amount">Fill in My budget (top of the page) to see a suggested amount.</div>';
        h += '</a>';
      });
      h += '</div>';
    }

    h += '<h2>Getting close</h2><p class="muted" style="margin:-4px 0 10px">Closest to joining the pre-buy watch. A fuller bar means closer.</p>';
    h += watch.length ? '<div class="list">' + watch.map(row).join("") + '</div>' : '<div class="card empty">Nothing valued yet.</div>';

    h += trackCard();

    h += '<h2>All quality businesses</h2><p class="muted" style="margin:-4px 0 10px">The ' + passing().length +
         ' companies that passed the quality screen, closest to their buy price first.</p>' +
         '<div class="list">' + passing().map(row).join("") + '</div>';

    h += '</div>' + footer();
    app.innerHTML = h;
    makeFolds(document.getElementById("homeBody"), "home");
    window.scrollTo(0, homeScroll);
    wireHome(s);
  }

  function row(c) {
    var right;
    if (c.signal) right = '<div style="color:var(--good-ink);font-weight:650">Pre-buy watch</div><div>' + pct(c.discount) + ' below value</div>';
    else if (c.to_buy_price != null) right = '<div>' + px(c.price) + '</div><div>needs ' + pct(c.to_buy_price) + ' drop</div>';
    else if (c.status === "FAIL") right = '<div class="st-fail">Didn’t pass</div><div>' + esc(failedNames(c)) + '</div>';
    else if (c.status === "NO_DATA") right = '<div class="st-fail">Not judged</div><div>too little history</div>';
    else if (c.status === "EXCLUDED") right = '<div class="st-fail">Not screened</div><div>' + esc(c.sector) + '</div>';
    else right = '<div>—</div><div>not valued</div>';
    var nearness = c.to_buy_price != null && !c.signal ? Math.max(4, 100 - c.to_buy_price * 100) : 0;
    return '<a class="li" href="#/' + encodeURIComponent(c.ticker) + '" data-k="' + esc((c.ticker + " " + c.name).toLowerCase()) + '">' +
      '<div class="l"><div>' + esc(c.ticker) + '</div><div class="nm">' + esc(c.name) + '</div>' +
      (nearness ? '<div class="near" aria-hidden="true"><span style="width:' + nearness.toFixed(0) + '%"></span></div>' : '') +
      '</div><div class="r">' + right + '</div><span class="chev" aria-hidden="true">›</span></a>';
  }

  function wireHome(s) {
    var det = document.getElementById("settings"), btn = document.getElementById("sizingBtn");
    btn.addEventListener("click", function () {
      det.open = !det.open; btn.setAttribute("aria-expanded", det.open);
    });
    var f = { cash: "sCash", maxPct: "sPct", maxHoldings: "sMax" };
    if (s) {
      document.getElementById("sCash").value = s.cash || "";
      document.getElementById("sPct").value = s.maxPct || "";
      document.getElementById("sMax").value = s.maxHoldings || "";
      document.getElementById("sHeld").value = (s.holdings || []).join(", ");
    }
    ["sCash", "sPct", "sMax", "sHeld"].forEach(function (id) {
      document.getElementById(id).addEventListener("change", function () {
        var n = function (id) { return parseFloat(String(document.getElementById(id).value).replace(/[$,%\s]/g, "")) || 0; };
        saveSizing({
          cash: n("sCash"), maxPct: n("sPct"), maxHoldings: Math.round(n("sMax")),
          holdings: document.getElementById("sHeld").value.toUpperCase().split(/[\s,]+/).filter(Boolean)
        });
        homeScroll = window.scrollY;
        home();
        document.getElementById("settings").open = true;
      });
    });
    var q = document.getElementById("q");
    q.value = lastQuery;
    q.addEventListener("input", function () { lastQuery = q.value; showResults(); });
    if (lastQuery) showResults();
  }

  // Search the whole S&P 500: exact ticker first, then tickers starting with the
  // query, then names containing it.
  function search(v) {
    v = v.trim().toLowerCase();
    if (!v) return [];
    var score = function (c) {
      var t = c.ticker.toLowerCase(), n = c.name.toLowerCase();
      if (t === v) return 0;
      if (t.indexOf(v) === 0) return 1;
      if (n.indexOf(v) === 0) return 2;
      if (n.indexOf(v) >= 0 || t.indexOf(v) >= 0) return 3;
      return 9;
    };
    return DATA.companies.map(function (c) { return [score(c), c]; })
      .filter(function (p) { return p[0] < 9; })
      .sort(function (a, b) { return a[0] - b[0] || a[1].ticker.localeCompare(b[1].ticker); })
      .slice(0, 30).map(function (p) { return p[1]; });
  }

  function showResults() {
    var res = document.getElementById("results"), body = document.getElementById("homeBody");
    var hits = search(lastQuery);
    if (!lastQuery.trim()) { res.hidden = true; body.hidden = false; return; }
    body.hidden = true; res.hidden = false;
    res.innerHTML = hits.length
      ? '<p class="muted" style="margin:6px 0 10px">' + hits.length + (hits.length === 30 ? '+' : '') + ' match' + (hits.length === 1 ? '' : 'es') + '</p>' +
        '<div class="list">' + hits.map(row).join("") + '</div>'
      : '<div class="card empty" style="margin-top:8px">No S&amp;P 500 company matches “' + esc(lastQuery.trim()) + '”. Try a ticker like KO or a name like Coca.</div>';
  }

  // Review flags come precomputed from review.py (same rules as the email alert).
  function holdingReasons(t) {
    var c = BY[t];
    if (!c) return [{ kind: "unknown", text: "Not in the S&P 500 list, so the screener can't check it" }];
    if (c.status === "EXCLUDED") return [{ kind: "unscreened", text: "Banks, insurers, REITs and utilities aren't screened, so it can't be checked" }];
    return c.review || [];
  }

  function holdingRow(t) {
    var c = BY[t], r = holdingReasons(t);
    var right = r.length
      ? '<div><span class="st-review">Review</span></div><div>' + esc(r[0].text) + (r.length > 1 ? ' +' + (r.length - 1) + ' more' : '') + '</div>'
      : '<div class="st-ok">✓ No flags</div><div>' + (c && c.price ? px(c.price) : '') + '</div>';
    var inner = '<div class="l"><div>' + esc(t) + '</div><div class="nm">' + esc(c ? c.name : "Unknown ticker") + '</div></div>' +
      '<div class="r" style="white-space:normal;max-width:60%">' + right + '</div>';
    return c ? '<a class="li" href="#/' + encodeURIComponent(t) + '">' + inner + '<span class="chev" aria-hidden="true">›</span></a>'
             : '<div class="li">' + inner + '</div>';
  }

  function passing() { return DATA.companies.filter(function (c) { return (c.status || "PASS") === "PASS"; }); }

  var CHECK_NAMES = { history: "Long track record", returns: "High, steady returns on capital", debt: "Low debt",
                      fcf: "Reliable free cash flow", earnings: "Consistent earnings" };
  var CHECK_SHORT = { history: "history", returns: "returns", debt: "debt", fcf: "cash flow", earnings: "earnings" };
  function failedNames(c) {
    var f = (c.checks || []).filter(function (k) { return k.passed === false; })
      .map(function (k) { return CHECK_SHORT[k.name] || k.name; });
    return f.length ? "failed: " + f.join(", ") : "";
  }

  // ---------- charts ----------
  // One series per chart (no legend; the title names it). Bars grow from a zero
  // baseline with a 4px rounded data end. Tap or hover a bar to read its value.
  function barChart(title, series, fmt) {
    var W = 320, H = 118, top = 6, bottom = 16;
    var vals = series.map(function (p) { return p.v; }).filter(function (v) { return v != null; });
    var el = document.createElement("div");
    el.className = "card chart";
    var latest = series.length ? series[series.length - 1] : null;
    var label = function (p) { return p ? "FY" + p.y + ": " + (p.v == null ? "—" : fmt(p.v)) : "—"; };
    el.innerHTML = '<div class="ct"><span>' + esc(title) + '</span><span class="ro">' + esc(label(latest)) + '</span></div>';
    if (!vals.length) { el.insertAdjacentHTML("beforeend", '<p class="muted">No data.</p>'); return el; }
    if (vals.every(function (v) { return v === 0; })) {
      el.insertAdjacentHTML("beforeend", '<p class="muted" style="margin-top:4px">Zero in every year.</p>'); return el;
    }
    var hi = Math.max(0, Math.max.apply(null, vals)), lo = Math.min(0, Math.min.apply(null, vals));
    if (hi === lo) hi = lo + 1;
    var plotH = H - top - bottom;
    var y = function (v) { return top + (hi - v) / (hi - lo) * plotH; };
    var band = W / series.length, bw = Math.min(24, band * 0.62), r = Math.min(4, bw / 2);
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(title) + ', last ' + series.length + ' years">';
    series.forEach(function (p, i) {
      var cx = band * i + band / 2, x0 = cx - bw / 2, x1 = cx + bw / 2;
      svg += '<rect x="' + (band * i) + '" y="0" width="' + band + '" height="' + (H - bottom) + '" fill="transparent" data-i="' + i + '"/>';
      if (p.v != null && p.v !== 0) {
        var y0 = y(0), y1 = y(p.v), hgt = Math.abs(y0 - y1), rr = Math.min(r, hgt);
        var d;
        if (p.v > 0) d = "M" + x0 + "," + y0 + "V" + (y1 + rr) + "Q" + x0 + "," + y1 + " " + (x0 + rr) + "," + y1 +
                         "H" + (x1 - rr) + "Q" + x1 + "," + y1 + " " + x1 + "," + (y1 + rr) + "V" + y0 + "Z";
        else d = "M" + x0 + "," + y0 + "V" + (y1 - rr) + "Q" + x0 + "," + y1 + " " + (x0 + rr) + "," + y1 +
                 "H" + (x1 - rr) + "Q" + x1 + "," + y1 + " " + x1 + "," + (y1 - rr) + "V" + y0 + "Z";
        svg += '<path class="bar" data-i="' + i + '" d="' + d + '" fill="' + (p.v < 0 ? "var(--neg)" : "var(--series)") + '" pointer-events="none"/>';
      }
      svg += '<text class="yr" x="' + cx + '" y="' + (H - 3) + '" text-anchor="middle">’' + String(p.y).slice(-2) + '</text>';
    });
    svg += '<line class="base" x1="0" x2="' + W + '" y1="' + y(0) + '" y2="' + y(0) + '"/></svg>';
    el.insertAdjacentHTML("beforeend", svg);
    var ro = el.querySelector(".ro"), bars = el.querySelectorAll(".bar");
    function pick(i) {
      el.classList.add("active");
      Array.prototype.forEach.call(bars, function (b) { b.classList.toggle("on", b.getAttribute("data-i") === String(i)); });
      ro.textContent = label(series[i]);
    }
    function clear() { el.classList.remove("active"); ro.textContent = label(latest); }
    Array.prototype.forEach.call(el.querySelectorAll("rect[data-i]"), function (hit) {
      var i = +hit.getAttribute("data-i");
      hit.addEventListener("pointerenter", function () { pick(i); });
      hit.addEventListener("click", function () { pick(i); });
    });
    el.querySelector("svg").addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse") clear(); });
    return el;
  }

  function cashDrop(d) {
    var labels = { profit: "Profit", timing: "Inventory, unpaid bills & timing", spending: "Stores & equipment spending", stock_pay: "Pay in stock" };
    var rows = ["profit", "timing", "spending", "stock_pay"].map(function (k) {
      var v = d.parts[k];
      return '<tr><td>' + labels[k] + '</td><td>' + (v >= 0 ? '+' : '−') + big(Math.abs(v)) + '</td></tr>';
    }).join('');
    return '<p><b>Why cash fell:</b> from ' + big(d.before) + ' (average of the two years before) to ' + big(d.last) +
      ' last year, <b>mainly because ' + esc(d.cause) + '</b> (' + esc(d.meaning) + ').</p>' +
      '<table><tr><th>Change in cash from…</th><th></th></tr>' + rows + '</table>' +
      '<p class="muted">Rough guide: if spending or timing items explain most of the drop, the higher value is more believable; ' +
      'if profit explains most of it, the lower one is. Read the latest earnings release to confirm.</p>';
  }

  // ---------- brief ----------
  function brief(c) {
    var s = loadSizing();
    var sized = sizeSignals(DATA.companies.filter(function (x) { return x.signal; }), s)[c.ticker];
    var status;
    if (c.signal) status = '<span class="pill good">Pre-buy watch · ' + pct(c.discount) + ' below value</span>';
    else if (c.to_buy_price != null) status = '<span class="pill">Watching · needs a ' + pct(c.to_buy_price) + ' drop to reach the pre-buy watch</span>';
    else if (c.status === "FAIL") status = '<span class="pill bad">Didn’t pass the quality screen</span>';
    else if (c.status === "NO_DATA") status = '<span class="pill">Not judged: too little history</span>';
    else if (c.status === "EXCLUDED") status = '<span class="pill">Not screened</span>';
    else status = '<span class="pill">Not valued: ' + esc(c.value_note || "insufficient data") + '</span>';

    var h = '<a class="back" href="#">‹ Back</a>' +
      '<h1>' + esc(c.name) + '</h1><p class="sub">' + esc(c.ticker) + ' · ' + esc(c.industry || c.sector) + '</p>' + status;
    var owned = s && (s.holdings || []).indexOf(c.ticker) >= 0;
    if (owned) {
      h += '<span class="pill own">You own this</span>';
      var rr = holdingReasons(c.ticker);
      h += '<h2>Your position</h2>' + (rr.length
        ? rr.map(function (x) { return '<div class="note"><b></b>' + esc(x.text) + '</div>'; }).join('') +
          '<p class="muted" style="margin-top:8px">Ask whether the reason you bought still holds. A falling price alone isn’t a reason to sell, ' +
          'and selling within a year of buying is taxed at your regular income rate.</p>'
        : '<div class="card"><p><span class="st-ok">✓ No review flags.</span> The business still passes the screen and the price isn’t far above its estimated value.</p></div>');
    }

    if (c.status === "EXCLUDED") {
      h += '<div class="card" style="margin-top:16px"><p>Banks, insurers, real-estate trusts and utilities are left out of this version. ' +
        'Borrowing is a normal part of how they work, so the debt and cash-flow rules would judge them unfairly.</p></div>' +
        '<h2>Read more</h2><div class="card links"><a href="https://finance.yahoo.com/quote/' + encodeURIComponent(c.ticker.replace(".", "-")) +
        '" target="_blank" rel="noopener">Quote and news<span>Yahoo</span></a></div>' + footer();
      app.innerHTML = h; window.scrollTo(0, 0); return;
    }
    var passed = (c.status || "PASS") === "PASS";

    if (passed) h += '<h2>Price vs. estimated value</h2><div class="card">' +
      '<div class="hero"><div><span>Price</span><b>' + px(c.price) + '</b></div>' +
      '<div><span>Buy below</span><b>' + px(c.buy_below) + '</b></div>' +
      '<div><span>Est. value</span><b>' + px(c.value) + '</b></div></div>' + rangeBar(c) +
      (c.value_no_recovery ? '<p class="muted" style="margin-top:10px">If cash flow doesn’t recover: <b>' + px(c.value_no_recovery) +
        '</b> per share. See “How the value was estimated”.</p>' : '');
    if (passed && c.signal) {
      if (sized && sized.amount) h += '<div class="amount">Suggested amount: <b>' + whole(sized.amount) + '</b></div>';
      else if (sized && sized.note) h += '<div class="amount">Suggested amount: none (' + esc(sized.note) + ')</div>';
      else h += '<div class="amount">Fill in My budget (top of the home page) to see a suggested amount.</div>';
    }
    if (passed) h += '</div>';

    var cs = cautions(c);
    if (cs.length) {
      h += '<h2>Check before deciding</h2><div>' + cs.map(function (w) { return '<div class="note"><b></b>' + esc(w) + '</div>'; }).join("") + '</div>';
    }

    h += '<h2>What it does</h2><div class="card"><p>' +
      (c.description ? esc(c.description) : 'No summary available. Item 1 (“Business”) of the 10-K below describes it in the company’s own words.') +
      '</p></div>';

    h += '<h2>' + (passed ? 'Why it passed the screen' : 'How it did on the quality screen') + '</h2>' +
      '<div class="card"><ul class="checks">' +
      (c.checks || []).map(function (k) {
        var cls = k.passed === false ? ' class="fail"' : k.passed == null ? ' class="na"' : '';
        return '<li' + cls + '>' + esc(CHECK_NAMES[k.name] || k.name) + '<span>' + esc(k.detail) + '</span></li>';
      }).join("") + '</ul>' +
      (passed ? '' : '<p class="muted" style="margin-top:8px">✕ failed · ? not enough data. A company must pass all five to be valued.</p>') +
      '</div>';

    if (c.value) {
      h += '<h2>How the value was estimated</h2><div class="card stack">' +
        '<p>Starts from <b>' + big(c.normalized_fcf) + '</b> a year of owner free cash flow: its typical cash-flow margin over the last 5 years × its latest sales, so one-off years don’t skew it.</p>' +
        '<p>Assumes <b>' + pct(c.growth, 1) + '</b> growth for 5 years (' + esc(c.value_note) + '), then ' +
        'moving to ' + pct(c.long_run_growth != null ? c.long_run_growth : DATA.settings.terminal_growth, 1) + ' a year (its 10-year sales trend, at most ' + pct(DATA.settings.terminal_growth, 1) + ')' +
        ' forever, all discounted at ' + pct(DATA.settings.discount_rate) + ' a year.</p>' +
        '<p>Divides by ' + (c.shares / 1e6).toFixed(0) + 'M shares. Debt (' + big(c.net_debt) + ' net) isn’t subtracted again: ' +
        'interest payments already reduce the cash flow above.</p>' +
        (c.value_low ? '<p><b>Range: ' + px(c.value_low) + ' to ' + px(c.value_high) + '</b> per share, from cautious ' +
          '(12% return demanded, 2% long-run growth) to optimistic (8%, 3%).</p>' : '') +
        (c.terminal_share ? '<p class="muted">' + pct(c.terminal_share) + ' of the estimate comes from cash beyond year 10, ' +
          'so it is sensitive to the long-run assumptions.</p>' : '') +
        (c.value_no_recovery ? '<p><b>If cash flow doesn’t recover: ' + px(c.value_no_recovery) + '</b> per share. ' +
          'Last year it actually produced ' + big(c.last_fcf) + ', less than the ' + big(c.normalized_fcf) + ' used above. ' +
          'This version starts from last year’s ' + big(c.last_fcf) + ' and grows no faster than last year’s sales (' +
          pct(c.last_growth, 1) + '). It isn’t used for the pre-buy watch; the gap between the two shows how much of the value is a bet on a comeback.</p>' : '') +
        (c.cash_drop ? cashDrop(c.cash_drop) : '') +
        '<p class="muted">Buy below = base value minus the ' + pct(DATA.settings.margin) + ' margin of safety.</p></div>';
    }

    if (passed && (c.fscore || c.zscore != null)) {
      h += '<h2>Is the business getting worse?</h2><div class="card stack">';
      if (c.fscore) {
        var f = c.fscore, fv = f.score <= 3 ? 'weakening' : f.score >= 7 ? 'strong and improving' : 'mixed';
        h += '<p><b>Piotroski F-score: ' + f.score + ' of ' + f.out_of + '</b> (' + fv + '). One point for each sign of health, ' +
          'comparing the latest year with the year before. 8–9 is strong; 0–3 means weakening on most measures.</p>' +
          '<div>' + f.checks.map(function (k) {
            var mark = k[1] === true ? '<span class="st-ok">✓</span>' : k[1] === false ? '<span class="st-fail">✗</span>' : '<span class="muted">–</span>';
            return '<div class="muted" style="padding:2px 0">' + mark + ' ' + esc(k[0]) + (k[1] == null ? ' (no data)' : '') + '</div>';
          }).join('') + '</div>';
      }
      if (c.zscore != null) {
        var z = c.zscore, zz = z < 1.81 ? 'distress zone' : z < 2.99 ? 'grey zone' : 'safe zone';
        h += '<p><b>Altman Z-score: ' + z.toFixed(1) + '</b> (' + zz + '). A classic bankruptcy-risk score: above 3 is safe, ' +
          '1.8–3 is grey, below 1.8 is distress. It often reads low for retailers, software and companies that have bought back a lot of stock, ' +
          'so treat it as a prompt to look at debt and cash, not a verdict.</p>';
      }
      h += '<p class="muted">Both scores are shown for information. They don’t change the estimated value or the pre-buy watch.</p></div>';
    }

    h += '<h2>Ten years</h2><div class="charts" id="charts"></div>';

    h += '<details class="tbl card" style="margin-top:10px"><summary>Show the numbers</summary><div class="tablewrap" style="margin-top:8px"><table>' +
      '<tr><th>FY</th><th>Revenue</th><th>Earnings</th><th>Owner FCF</th><th>' + esc(c.returns_basis) + '</th><th>LT debt</th></tr>' +
      c.annual.slice().reverse().map(function (r) {
        return '<tr><td>' + r.y + '</td><td>' + big(r.revenue) + '</td><td>' + big(r.net_income) + '</td><td>' +
          big(r.owner_fcf) + '</td><td>' + pct(r.ret, 1) + '</td><td>' + big(r.debt) + '</td></tr>';
      }).join("") + '</table></div></details>';

    var L = c.links || {};
    h += '<h2>Read before deciding</h2><div class="card links">';
    if (L.ten_k) h += '<a href="' + esc(L.ten_k) + '" target="_blank" rel="noopener">Latest annual report (10-K)<span>' + esc(L.ten_k_date || "") + '</span></a>';
    if (L.earnings) h += '<a href="' + esc(L.earnings) + '" target="_blank" rel="noopener">Latest earnings release<span>' + esc(L.earnings_date || "") + '</span></a>';
    if (L.all_filings) h += '<a href="' + esc(L.all_filings) + '" target="_blank" rel="noopener">All SEC filings<span>EDGAR</span></a>';
    h += '<a href="https://finance.yahoo.com/quote/' + encodeURIComponent(c.ticker.replace(".", "-")) + '" target="_blank" rel="noopener">Quote and news<span>Yahoo</span></a></div>';

    h += footer();
    app.innerHTML = h;
    window.scrollTo(0, 0);

    var box = document.getElementById("charts"), A = c.annual;
    var ser = function (k) { return A.map(function (r) { return { y: r.y, v: r[k] }; }); };
    box.appendChild(barChart("Revenue", ser("revenue"), big));
    box.appendChild(barChart("Earnings", ser("net_income"), big));
    box.appendChild(barChart("Owner free cash flow", ser("owner_fcf"), big));
    box.appendChild(barChart(c.returns_basis === "ROE" ? "Return on equity" : "Return on capital", ser("ret"), function (v) { return pct(v, 1); }));
    box.appendChild(barChart("Long-term debt", ser("debt"), big));
    makeFolds(app, "brief");
  }

  // ---------- Phase 5: paper tracking ----------
  function signedPct(x) { return x == null ? "—" : (x >= 0 ? "+" : "−") + (Math.abs(x) * 100).toFixed(1) + "%"; }
  function shortDate(d) {
    if (!d) return "—";
    var p = d.split("-"), m = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return m[+p[1] - 1] + " " + (+p[2]) + ", " + p[0];
  }
  function trackEntries() { return (DATA.tracking && DATA.tracking.entries) || []; }
  function trackStats(es) {
    var done = es.filter(function (e) { return e.ret != null; });
    var avg = function (k) {
      var v = done.filter(function (e) { return e[k] != null; });
      return v.length ? v.reduce(function (a, e) { return a + e[k]; }, 0) / v.length : null;
    };
    return { n: es.length, measured: done.length, ret: avg("ret"), spy: avg("spy"), vtv: avg("vtv"),
             beat: done.filter(function (e) { return e.spy != null && e.ret > e.spy; }).length };
  }
  function trackCard() {
    var T = DATA.tracking;
    if (!T) return "";
    var st = trackStats(trackEntries());
    var h = '<h2>Track record</h2><a class="card sig" href="#/~track">';
    if (!st.n) {
      h += '<p>Nothing recorded yet. Since ' + esc(shortDate(T.summary.started)) +
           ', every stock that enters the pre-buy watch is recorded automatically and compared with the S&amp;P 500.</p>';
    } else {
      h += '<div class="row1"><span>' + st.n + ' pick' + (st.n === 1 ? '' : 's') + ' since ' +
        esc(shortDate(T.summary.started)) + '</span><span class="chev" aria-hidden="true">›</span></div>' +
        '<div class="nums"><span>Picks <b>' + signedPct(st.ret) + '</b></span><span>S&amp;P 500 <b>' +
        signedPct(st.spy) + '</b></span><span>Value fund <b>' + signedPct(st.vtv) + '</b></span></div>';
    }
    return h + '</a>';
  }
  function trackPage() {
    var T = DATA.tracking || { summary: {}, entries: [] };
    var es = trackEntries().slice().sort(function (a, b) { return b.start.localeCompare(a.start); });
    var s = loadSizing(), held = {};
    ((s && s.holdings) || []).forEach(function (t) { held[t] = true; });
    var all = trackStats(es), mine = trackStats(es.filter(function (e) { return held[e.ticker]; }));

    var h = '<a class="back" href="#">‹ All companies</a><h1>Track record</h1>' +
      '<p class="sub">Model ' + esc(T.summary.model || "") + ' · recording since ' + esc(shortDate(T.summary.started)) + '</p>';
    h += '<div class="card stack"><p>Every stock is recorded automatically on the day it enters the pre-buy watch, then “held on paper”. ' +
      'Its return (price change plus dividends) is compared with putting the same money into the S&amp;P 500 (SPY) ' +
      'and a value-stock fund (VTV) on the same day.</p>' +
      '<p class="muted">Months of results are mostly luck. Judge the model on years and many signals, not on a few winners or losers.</p></div>';

    var block = function (title, st) {
      if (!st.measured) return '';
      return '<h2>' + title + '</h2><div class="summary">' +
        '<div class="stat"><b>' + signedPct(st.ret) + '</b><span>picks, average</span></div>' +
        '<div class="stat"><b>' + signedPct(st.spy) + '</b><span>S&amp;P 500, same days</span></div>' +
        '<div class="stat"><b>' + signedPct(st.vtv) + '</b><span>value fund, same days</span></div></div>' +
        '<p class="muted" style="margin:8px 0 0">Beat the S&amp;P 500: ' + st.beat + ' of ' + st.measured + '.</p>';
    };
    h += block("Every pick (" + all.n + ")", all);
    if (mine.n) h += block("Picks you hold (" + mine.n + ")", mine);

    h += '<h2>All recorded picks</h2>';
    if (!es.length) {
      h += '<div class="card empty">None yet. The screen is strict, so weeks can pass without one.</div>';
    } else {
      h += '<div class="card tablewrap"><table><thead><tr><th>Stock</th><th>Date</th><th>Price</th>' +
        '<th>Return</th><th>S&amp;P</th><th>VTV</th></tr></thead><tbody>' +
        es.map(function (e) {
          var flags = (e.warnings && e.warnings.length ? ' !' : '') + (e.verify ? ' V' : '') + (e.suspicious ? ' ?' : '');
          return '<tr><td><a href="#/' + encodeURIComponent(e.ticker) + '">' + esc(e.ticker) + '</a>' +
            (held[e.ticker] ? ' ●' : '') + esc(flags) + (e.active ? '' : '<div class="muted" style="font-size:12px">ended</div>') + '</td>' +
            '<td>' + esc(e.start.slice(5).replace("-", "/") + "/" + e.start.slice(2, 4)) + '</td><td>' + px(e.price) + '</td><td>' + signedPct(e.ret) + '</td>' +
            '<td>' + signedPct(e.spy) + '</td><td>' + signedPct(e.vtv) + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<p class="muted">Date = the day it entered the pre-buy watch; Price = the price that day. ' +
        '● you hold it · ! had a warning · V numbers estimated · ? discount looked too large · ' +
        'ended = left the pre-buy watch, still tracked from its start date.</p>' +
        '<p><button class="iconbtn" id="csvBtn">Download as a spreadsheet (CSV)</button></p>';
    }
    h += footer();
    app.innerHTML = h;
    makeFolds(app, "track");
    window.scrollTo(0, 0);
    var b = document.getElementById("csvBtn");
    if (b) b.addEventListener("click", function () { downloadCsv(es); });
  }
  function downloadCsv(es) {
    var cols = ["ticker","name","sector","start","active","ended","price","value","value_low","value_high",
                "buy_below","discount","terminal_share","growth","verify","suspicious","warnings","ret","spy","vtv","as_of","model","code"];
    var q = function (v) { v = Array.isArray(v) ? v.join("; ") : (v == null ? "" : String(v)); return '"' + v.replace(/"/g, '""') + '"'; };
    var csv = cols.join(",") + "\n" + es.map(function (e) { return cols.map(function (k) { return q(e[k]); }).join(","); }).join("\n");
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = "signal-track-record.csv";
    document.body.appendChild(a); a.click(); a.remove();
  }

  // ---------- collapsible sections ----------
  // Every section heading becomes a tap-to-hide/show button. What you hide is
  // remembered on this device, per page type (home, company brief, track record).
  var FOLDKEY = "valueScreener.folds.v1";
  var FOLD_DEFAULT_CLOSED = { "home:All quality businesses": true };
  function foldState() { try { return JSON.parse(localStorage.getItem(FOLDKEY)) || {}; } catch (e) { return {}; } }
  function saveFold(st) { try { localStorage.setItem(FOLDKEY, JSON.stringify(st)); } catch (e) {} }
  function foldName(t) { return t.replace(/\s*\(.*\)\s*$/, "").trim(); }
  function makeFolds(container, scope) {
    if (!container) return;
    var st = foldState(), heads = [];
    Array.prototype.slice.call(container.children).forEach(function (el) {
      if (el.tagName !== "H2") return;
      var key = scope + ":" + foldName(el.textContent);
      var open = key in st ? st[key] : !FOLD_DEFAULT_CLOSED[key];
      var body = document.createElement("div");
      body.className = "foldbody";
      var n = el.nextElementSibling;
      while (n && n.tagName !== "H2" && n.tagName !== "FOOTER" && !n.classList.contains("keep")) {
        var next = n.nextElementSibling; body.appendChild(n); n = next;
      }
      var btn = document.createElement("button");
      btn.className = "foldhead"; btn.type = "button";
      btn.setAttribute("aria-expanded", String(open));
      el.parentNode.insertBefore(btn, el);
      btn.appendChild(el);
      var hint = document.createElement("span"); hint.className = "fc"; hint.setAttribute("aria-hidden", "true");
      btn.appendChild(hint);
      btn.parentNode.insertBefore(body, btn.nextSibling);
      body.hidden = !open;
      btn.addEventListener("click", function () {
        var now = body.hidden; body.hidden = !now; btn.setAttribute("aria-expanded", String(now));
        var s2 = foldState(); s2[key] = now; saveFold(s2);
      });
      heads.push([btn, body, key]);
    });
    if (heads.length > 2) {
      var tools = document.createElement("div"); tools.className = "foldtools";
      tools.innerHTML = '<button type="button" data-a="1">Expand all</button><button type="button" data-a="0">Collapse all</button>';
      heads[0][0].parentNode.insertBefore(tools, heads[0][0]);
      tools.addEventListener("click", function (e) {
        var a = e.target.getAttribute && e.target.getAttribute("data-a");
        if (a == null) return;
        var s2 = foldState();
        heads.forEach(function (x) { x[1].hidden = a !== "1"; x[0].setAttribute("aria-expanded", String(a === "1")); s2[x[2]] = a === "1"; });
        saveFold(s2);
      });
    }
  }

  function footer() {
    return '<footer>Screening output, not investment advice: it finds candidates, you decide. ' +
      'Financials from SEC filings; prices from Yahoo, as of the last close before ' + esc(DATA.generated) + '. ' +
      'Values are rough estimates and can be badly wrong.' +
      (RAW.locked ? ' <a href="#" id="lockBtn">Lock this device</a>' : '') + '</footer>';
  }
  document.addEventListener("click", function (e) {
    if (e.target && e.target.id === "lockBtn") {
      e.preventDefault(); forgetKey(); location.hash = ""; location.reload();
    }
  });

  // ---------- routing ----------
  function route() {
    if (!DATA) return;
    var m = location.hash.match(/^#\/(.+)$/);
    if (m && m[1] === "~track") return trackPage();
    var c = m && BY[decodeURIComponent(m[1])];
    if (c) brief(c); else home();
  }
  window.addEventListener("hashchange", route);
  // Remember where you were on the home page, so "back" returns to the same spot.
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest('a[href^="#/"]');
    if (a && !/^#\//.test(location.hash)) homeScroll = window.scrollY;
  });
  start();
})();
</script>
